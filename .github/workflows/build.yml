name: TWRP

on:
  push:
    branches:
      - 'twrp-12.1'
    paths:
      - 'version.mk'
  workflow_dispatch:

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        max-size: "10G"

    - name: Prepare the environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex fontconfig \
          g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev \
          lib32readline-dev lib32z1-dev libbz2-dev libc6-dev-i386 libgl1-mesa-dev \
          liblz4-tool libncurses-dev libssl-dev libx11-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Install Git-Repo
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize Repo
      run: |
        mkdir twrp
        cd twrp
        git config --global user.name "${{ github.repository_owner }}"
        git config --global user.email "${{ github.repository_owner }}@users.noreply.github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone "https://github.com/${GITHUB_REPOSITORY}.git" -b "${GITHUB_REF_NAME}" ./device/samsung/gta9p
        cd device/samsung/gta9p
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "VERSION=$(grep '^TW_DEVICE_VERSION' version.mk | awk '{print $3}')" >> $GITHUB_ENV

    - name: Building Image
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        cd twrp
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch twrp_gta9p-eng && make clean && mka recoveryimage
        cd out/target/product/gta9p
        tar -cvf recovery.tar recovery.img

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          twrp/out/target/product/gta9p/recovery.img
          twrp/out/target/product/gta9p/recovery.tar
        name: TWRP gta9p (SM-X216B) ${{ env.BUILD_DATE }}
        tag_name: ${{ github.run_id }}
        body: Build ${{ env.VERSION }} from ${{ env.COMMIT_ID }}
